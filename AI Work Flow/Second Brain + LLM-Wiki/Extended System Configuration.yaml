workflow_name: "Lean_AI_Software_Engineering_Pipeline"
version: "3.5.0_Lean_Architecture"

global_constraints:
  minimum_model_version: "Flash 3.8 High"
  fallback_behavior: "reject_if_below_minimum_model"
  communication_format: "Structured_Markdown_and_JSON_Handoff"
  code_completeness_policy: "NO_PLACEHOLDERS_IN_TARGET_SCOPE"
  skill_enforcement_policy: "STRICT_PRIORITY_OVER_DEFAULT_KNOWLEDGE"
  token_optimization_policy: "MAP_FIRST_SURGICAL_LINE_RANGE_ONLY"
  strict_surgical_policy: "STRICT_SURGICAL_SCOPE_ONLY"
  git_push_policy: "STRICTLY_PROHIBITED_UNLESS_EXPLICIT_USER_COMMAND"

storage_architecture:
  second_brain_vault_path: "./second_brain_vault/"
  second_brain_index_file: "./second_brain_vault/00_INDEX_MOC.md"
  skill_registry_path: "./ai_skills_registry/"
  skill_catalog_file: "./ai_skills_registry/SKILL_CATALOG.json"
  codebase_map_path: "./.ai_map/"
  codebase_process_map: "./.ai_map/00_PROCESS_FLOW_MAP.md"
  codebase_function_index: "./.ai_map/01_FILE_FUNCTION_INDEX.md"
  codebase_ast_index: "./.ai_map/CODE_INDEX.json"
  codebase_scanner_script: "./.ai_map/vscode_ast_mapper.mjs"

agents:
  orchestrator:
    id: "agent_00_orchestrator"
    role: "Master Technical Orchestrator & Knowledge Manager"
    model: "Flash 3.8 High"
    execution_stages:
      - "Stage_1_PreFlight_Context_Retrieval_and_Dual_Plan_Delivery"
      - "Stage_4_PostFlight_Knowledge_Ingestion_and_Final_Report"

  subagent_implementer:
    id: "subagent_01_implementer"
    role: "Surgical Implementer & AST Codebase Map Syncer"
    model: "Flash 3.8 High"
    execution_stages:
      - "Stage_2_Surgical_Code_Implementation_and_Map_Sync"

  subagent_qa_auditor:
    id: "subagent_02_qa_auditor"
    role: "QA Auditor & Branch Main Diff Specialist"
    model: "Flash 3.8 High"
    execution_stages:
      - "Stage_3_QA_Verification_and_Branch_Main_Diff_Audit"
