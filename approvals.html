<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อนุมัติลงเวลากรณีพิเศษ - ระบบลงเวลาปฏิบัติราชการ กรุงเทพมหานคร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/css/bma-theme.css">
</head>
<body class="min-h-screen flex flex-col bg-[#E7ECE9] dark:bg-[#0B132B] text-slate-800 dark:text-slate-100 antialiased">

    <!-- Dark Slate Sidebar -->
    <div id="bmaSidebarContainer"></div>

    <div class="lg:pl-72 flex-1 flex flex-col min-h-screen">
        <!-- Glassmorphic Topbar -->
        <div id="bmaTopbarContainer"></div>

        <main class="flex-1 p-4 lg:p-8 space-y-7">

            <!-- Material Dashboard PRO - Master Floating Header Card -->
            <div class="relative bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200/80 dark:border-slate-700/60 mt-8 mb-6">
                
                <!-- Floating Emerald Header (Offset -mt-6) -->
                <div class="-mt-6 mx-4 sm:mx-6 rounded-2xl p-5 bg-gradient-to-r from-[#00744B] via-[#008F5D] to-[#00A368] text-white shadow-lg shadow-emerald-900/30 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center text-white text-xl shadow-inner shrink-0">
                            <i class="fa-solid fa-bell-concierge"></i>
                        </div>
                        <div>
                            <h2 class="text-base sm:text-lg font-extrabold tracking-wide text-white">รายการขออนุมัติลงเวลาปฏิบัติราชการกรณีพิเศษ</h2>
                            <p class="text-xs text-emerald-100/90 font-medium mt-0.5">ตรวจสอบและอนุมัติคำขอลงเวลากรณีพิเศษของบุคลากรตามขอบเขตการมองเห็น</p>
                        </div>
                    </div>

                    <!-- Bulk Actions & Refresh Pill Buttons -->
                    <div class="flex flex-wrap items-center gap-2.5">
                        <button type="button" id="btnBulkApprove" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold bg-white text-[#00744B] hover:bg-emerald-50 transition shadow-md cursor-pointer">
                            <i class="fa-solid fa-check-double"></i>
                            <span>อนุมัติที่เลือก (<span id="selectedBulkCount" class="font-extrabold">0</span>)</span>
                        </button>
                        
                        <button type="button" id="btnBulkReject" class="inline-flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-bold bg-rose-500/80 hover:bg-rose-600 text-white border border-rose-300/40 backdrop-blur-md transition shadow-md cursor-pointer">
                            <i class="fa-solid fa-ban"></i>
                            <span>ไม่อนุมัติที่เลือก</span>
                        </button>

                        <button type="button" id="btnRefreshApprovals" class="inline-flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-bold bg-white/15 hover:bg-white/25 text-white backdrop-blur-md border border-white/20 transition shadow-sm cursor-pointer">
                            <i class="fa-solid fa-rotate"></i>
                            <span>รีเฟรช</span>
                        </button>
                    </div>
                </div>

                <!-- Card Body -->
                <div class="p-4 sm:p-6 space-y-5">
                    
                    <!-- Segmented Filter Bar -->
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-3.5 p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200/60 dark:border-slate-700/60 items-center">
                        <div class="md:col-span-5">
                            <label for="selectApprovalStatusFilter" class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">
                                <i class="fa-solid fa-filter mr-1 text-[#00744B]"></i>สถานะคำขอ:
                            </label>
                            <select id="selectApprovalStatusFilter" class="bma-select w-full py-2 px-3 text-xs font-semibold rounded-xl border-slate-300 dark:border-slate-600">
                                <option value="pending" selected>รออนุมัติ (Pending)</option>
                                <option value="approved">อนุมัติแล้ว (Approved)</option>
                                <option value="rejected">ไม่อนุมัติ (Rejected)</option>
                                <option value="all">แสดงทั้งหมด</option>
                            </select>
                        </div>

                        <div class="md:col-span-7">
                            <label for="selectApprovalGroupBy" class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">
                                <i class="fa-solid fa-layer-group mr-1 text-[#00744B]"></i>มุมมองการจัดกลุ่มตาราง (Group By):
                            </label>
                            <select id="selectApprovalGroupBy" class="bma-select w-full py-2 px-3 text-xs font-semibold rounded-xl border-slate-300 dark:border-slate-600">
                                <option value="division" selected>มุมมองที่ 1: สำนักงาน/กอง &gt; ส่วน/ฝ่าย</option>
                                <option value="group">มุมมองที่ 2: สำนักงาน/กอง &gt; ส่วน/ฝ่าย &gt; กลุ่มงาน</option>
                            </select>
                        </div>
                    </div>

                    <!-- Modern Responsive Table -->
                    <div class="bma-table-container rounded-xl overflow-hidden border border-slate-200/80 dark:border-slate-700/60">
                        <table class="bma-table text-sm w-full text-left">
                            <thead class="bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 text-xs uppercase font-extrabold tracking-wider border-b border-slate-200 dark:border-slate-700">
                                <tr>
                                    <th class="w-12 text-center py-3.5 px-3">
                                        <input type="checkbox" id="chkSelectAllApprovals" class="w-4 h-4 accent-[#00744B] rounded cursor-pointer" title="เลือกทั้งหมด">
                                    </th>
                                    <th class="w-14 text-center py-3.5 px-3">ลำดับ</th>
                                    <th class="min-w-[190px] py-3.5 px-3">คำนำหน้า + ชื่อ + นามสกุล</th>
                                    <th class="min-w-[180px] py-3.5 px-3">ตำแหน่ง + ระดับ</th>
                                    <th class="min-w-[160px] py-3.5 px-3">วันที่ขอ / ช่วงเวลา</th>
                                    <th class="min-w-[180px] py-3.5 px-3">หมายเหตุ</th>
                                    <th class="w-48 text-center py-3.5 px-3">คำสั่ง [อนุมัติ / ไม่อนุมัติ]</th>
                                </tr>
                            </thead>
                            <tbody id="approvalsTableBody" class="divide-y divide-slate-200 dark:divide-slate-700/60"></tbody>
                        </table>
                    </div>

                </div>
            </div>

        </main>

        <div id="bmaFooterContainer"></div>
    </div>

    <div id="bmaMobileBottomNav"></div>

    <script type="module" src="assets/js/controllers/ApprovalsController.js"></script>
</body>
</html>
