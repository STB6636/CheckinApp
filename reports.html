<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานการลงเวลาปฏิบัติราชการ - กรุงเทพมหานคร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/css/bma-theme.css">
</head>
<body class="min-h-screen flex flex-col">

    <!-- Deep Emerald Sidebar -->
    <div id="bmaSidebarContainer"></div>

    <div class="lg:pl-72 flex-1 flex flex-col min-h-screen">
        <!-- Topbar -->
        <div id="bmaTopbarContainer"></div>

        <!-- เนื้อหาหลักของหน้ารายงานการลงเวลา -->
        <main class="flex-1 p-4 lg:p-8 space-y-6">

            <!-- เฉพาะเมื่อ Responsive Mobile เท่านั้น: เมนูทางลัดไอคอนสีเหมือนโทรศัพท์ iPhone -->
            <div id="reportMobileShortcutContainer"></div>

            <!-- การ์ดควบคุมฟิลเตอร์ข้อมูล: เลือกวันที่ 2 รูปแบบ, เลือกมุมมอง Group By, และเลือก TAG สถานะ -->
            <div class="bma-card p-5 space-y-5" style="border-top: 4px solid var(--g1);">

                <!-- ส่วนหัวและปุ่มคำสั่งหลัก -->
                <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b bma-border pb-4">
                    <div>
                        <h2 class="text-base font-extrabold bma-text-main flex items-center gap-2">
                            <i class="fa-solid fa-file-invoice" style="color: var(--bma-primary);"></i>
                            <span>รายงานการลงเวลาปฏิบัติราชการ</span>
                        </h2>
                        <p id="reportDateDisplaySubtitle" class="text-xs font-bold mt-1" style="color: var(--bma-primary);">
                            ประจำวันที่ 15 มกราคม 2569
                        </p>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                        <button type="button" id="btnOpenAddReportRecord" class="btn-bma-primary text-xs py-2.5 px-3.5">
                            <i class="fa-solid fa-plus"></i>
                            <span>เพิ่มเวลาปฏิบัติราชการ</span>
                        </button>

                        <button type="button" id="btnPrintPdfNewTab" class="btn-bma-soft text-xs py-2.5 px-3.5 border border-[#007B3E]/30">
                            <i class="fa-solid fa-file-pdf text-rose-600"></i>
                            <span>พิมพ์ / ส่งออก PDF (เปิด Tab ใหม่)</span>
                        </button>

                        <button type="button" id="btnExportReportExcel" class="btn-bma-outline text-xs py-2 px-3">
                            <i class="fa-solid fa-file-excel text-emerald-600"></i>
                            <span>ส่งออก Excel</span>
                        </button>

                        <button type="button" id="btnTemplateReportExcel" class="btn-bma-outline text-xs py-2 px-3">
                            <i class="fa-solid fa-download text-sky-500"></i>
                            <span>Template Excel</span>
                        </button>
                    </div>
                </div>

                <!-- แถวที่ 1: ระบบเลือกวันที่ 2 รูปแบบ (วันเดียว / ช่วงวันที่) และมุมมอง Group By -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-end">

                    <!-- รูปแบบการเลือกวันที่ -->
                    <div class="lg:col-span-3">
                        <label class="block text-xs font-bold bma-text-main mb-1.5">
                            <i class="fa-regular fa-calendar mr-1" style="color: var(--bma-primary);"></i>รูปแบบการเลือกวันที่:
                        </label>
                        <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bma-info-box">
                            <button type="button" id="btnModeSingleDate" class="py-1.5 px-2.5 rounded-lg text-xs font-bold transition bg-[#007B3E] text-white shadow-xs cursor-pointer">
                                เลือกวันเดียว
                            </button>
                            <button type="button" id="btnModeRangeDate" class="py-1.5 px-2.5 rounded-lg text-xs font-bold transition bma-text-sub hover:bg-black/5 cursor-pointer">
                                เลือกเป็นช่วง
                            </button>
                        </div>
                    </div>

                    <!-- ช่องเลือกวันที่ (สลับตามโหมด วันเดียว / ช่วงวันที่) -->
                    <div class="lg:col-span-5">
                        <!-- โหมดที่ 1: เลือกวันที่ (วันเดียว) -->
                        <div id="singleDatePickerBox">
                            <label class="block text-xs font-bold bma-text-sub mb-1">เลือกวันที่ปฏิบัติราชการ:</label>
                            <input type="date" id="reportSingleDateInput" class="bma-input py-2 text-sm font-semibold">
                        </div>

                        <!-- โหมดที่ 2: เลือกวันที่เป็นช่วง (ตั้งแต่วันที่ xxx ถึงวันที่ xxx) -->
                        <div id="rangeDatePickerBox" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            <div>
                                <label class="block text-xs font-bold bma-text-sub mb-1">ตั้งแต่วันที่:</label>
                                <input type="date" id="reportStartDateInput" class="bma-input py-2 text-sm font-semibold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold bma-text-sub mb-1">ถึงวันที่:</label>
                                <input type="date" id="reportEndDateInput" class="bma-input py-2 text-sm font-semibold">
                            </div>
                        </div>
                    </div>

                    <!-- มุมมองการจัดกลุ่มตาราง (Group By 2 มุมมอง) -->
                    <div class="lg:col-span-4">
                        <label class="block text-xs font-bold bma-text-sub mb-1">มุมมองการจัดกลุ่มตาราง (Group By):</label>
                        <select id="selectReportGroupBy" class="bma-select py-2 text-xs font-semibold">
                            <option value="division">มุมมองที่ 1: สำนักงาน/กอง &gt; ส่วน/ฝ่าย</option>
                            <option value="group">มุมมองที่ 2: สำนักงาน/กอง &gt; ส่วน/ฝ่าย &gt; กลุ่มงาน</option>
                        </select>
                    </div>
                </div>

                <!-- แถวที่ 2: ระบบกรองค่า "สถานะ" แบบเลือก TAG ได้หลายค่าพร้อมกัน (แยกตารางตาม Tag ที่เลือก) -->
                <div class="p-4 rounded-xl bma-info-box space-y-2.5">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <div class="text-xs font-extrabold bma-text-main flex items-center gap-1.5">
                            <i class="fa-solid fa-tags" style="color: var(--bma-primary);"></i>
                            <span>กรองตามสถานะ (คลิกเลือก TAG ได้หลายค่าพร้อมกัน — ระบบจะแสดงแยกตารางตาม TAG ที่เลือก):</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button type="button" id="btnSelectDefaultTags" class="text-[11px] font-bold underline cursor-pointer" style="color: var(--bma-primary);">
                                ค่าเริ่มต้น (ปฏิบัติงานปกติ + มาสาย)
                            </button>
                            <span class="bma-text-muted">|</span>
                            <button type="button" id="btnSelectAllStatusTags" class="text-[11px] font-bold underline bma-text-sub cursor-pointer">
                                เลือกทั้งหมด (5 สถานะ)
                            </button>
                        </div>
                    </div>

                    <!-- ปุ่ม TAG สถานะทั้ง 5 รายการ -->
                    <div id="statusTagsFilterContainer" class="flex flex-wrap items-center gap-2 pt-1"></div>
                </div>

            </div>

            <!-- พื้นที่แสดงตารางแยกตาม TAG สถานะที่กดเลือก (1 Tag = 1 ตาราง, 2 Tags = 2 ตาราง, N Tags = N ตาราง) -->
            <div id="reportTablesMasterContainer" class="space-y-6"></div>

        </main>

        <div id="bmaFooterContainer"></div>
    </div>

    <div id="bmaMobileBottomNav"></div>

    <!-- Modal เพิ่ม / แก้ไขข้อมูลการลงเวลาสำหรับผู้ดูแลระบบ -->
    <div id="modalReportAttendance" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
        <div class="w-full max-w-md bma-card bma-modal-surface p-6 shadow-2xl">
            <div class="flex items-center justify-between pb-3 mb-4 border-b bma-border">
                <h3 id="modalReportTitle" class="text-lg font-bold bma-text-main">บันทึก/แก้ไขเวลาปฏิบัติราชการ</h3>
                <button type="button" id="btnCloseReportModal" class="p-1.5 rounded-lg bma-text-sub hover:bg-black/10">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="formReportAttendance" class="space-y-3.5">
                <input type="hidden" id="repLogId">

                <div>
                    <label class="block text-xs font-bold bma-text-main mb-1">เลือกบุคลากร *</label>
                    <select id="repPersonnelSelect" class="bma-select text-sm" required></select>
                </div>

                <div>
                    <label class="block text-xs font-bold bma-text-main mb-1">วันที่ปฏิบัติราชการ *</label>
                    <input type="date" id="repWorkDate" class="bma-input text-sm" required>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold bma-text-main mb-1">เวลาเข้างาน (24 ชม.) *</label>
                        <input type="text" id="repCheckinTime" class="bma-input text-sm font-mono text-center" value="08:30" placeholder="08:30" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold bma-text-main mb-1">เวลาเลิกงาน (24 ชม.)</label>
                        <input type="text" id="repCheckoutTime" class="bma-input text-sm font-mono text-center" value="16:30" placeholder="16:30">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold bma-text-main mb-1">สถานะทางการ *</label>
                    <select id="repStatusSelect" class="bma-select text-sm font-semibold">
                        <option value="ปฏิบัติงานปกติ">ปฏิบัติงานปกติ</option>
                        <option value="มาสาย">มาสาย</option>
                        <option value="ขาดราชการ">ขาดราชการ</option>
                        <option value="ปฏิบัติงานนอกเวลาราชการ">ปฏิบัติงานนอกเวลาราชการ</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold bma-text-main mb-1">หมายเหตุ</label>
                    <input type="text" id="repRemarkInput" class="bma-input text-sm" placeholder="ระบุหมายเหตุ (ถ้ามี)">
                </div>

                <div class="pt-3 flex items-center justify-end gap-2 border-t bma-border">
                    <button type="button" id="btnCancelReportModal" class="btn-bma-outline text-sm">ยกเลิก</button>
                    <button type="submit" class="btn-bma-primary text-sm">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>บันทึกข้อมูล</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="assets/js/controllers/ReportsController.js"></script>
</body>
</html>
