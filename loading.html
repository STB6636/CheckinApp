<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Force Browser Revalidation & Auto Cache-Busting (Remote version.json + Hard Cache Purge) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        (function() {
            const CURRENT_APP_BUILD = '20261117_d723e0d9';
            const BUILD_STORAGE_KEY = 'bma_app_build';
            const RELOAD_GUARD_KEY = 'bma_reloaded_build';
            const PRESERVE_KEYS = [
                'bma_checkin_session_user_v2_7',
                'bma_checkin_theme_mode_v2_7',
                'bma_remember_me',
                'bma_remember_username',
                'bma_last_seen_update_build',
                'bma_last_seen_announcement_id',
                BUILD_STORAGE_KEY
            ];

            // Clean up temporary cache-busting query param (?_cb=...) after forced reload
            try {
                const url = new URL(window.location.href);
                if (url.searchParams.has('_cb')) {
                    url.searchParams.delete('_cb');
                    window.history.replaceState(null, '', url.pathname + url.search + url.hash);
                }
            } catch (_) {}

            let purgePromise = null;
            function performHardCachePurge(targetBuild) {
                window.__bmaPurgeActive = true;
                purgePromise = (async () => {
                    try {
                        if (sessionStorage.getItem(RELOAD_GUARD_KEY) === targetBuild) return;
                        sessionStorage.setItem(RELOAD_GUARD_KEY, targetBuild);

                        Object.keys(localStorage).forEach((key) => {
                            if (!PRESERVE_KEYS.includes(key)) {
                                localStorage.removeItem(key);
                            }
                        });
                        localStorage.setItem(BUILD_STORAGE_KEY, targetBuild);

                        if ('caches' in window) {
                            const names = await window.caches.keys();
                            await Promise.all(names.map((n) => window.caches.delete(n)));
                        }
                        if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
                            const regs = await navigator.serviceWorker.getRegistrations();
                            await Promise.all(regs.map((r) => r.unregister()));
                        }
                        try {
                            await fetch(window.location.pathname, { cache: 'reload', credentials: 'same-origin' });
                        } catch (_) {}

                        const nextUrl = new URL(window.location.href);
                        nextUrl.searchParams.set('_cb', targetBuild);
                        window.location.replace(nextUrl.toString());
                    } catch (err) {
                        console.warn('[CacheBuster] Hard purge error:', err);
                    } finally {
                        window.__bmaPurgeActive = false;
                    }
                })();
                window.__bmaPurgePromise = purgePromise;
                return purgePromise;
            }

            try {
                const prevBuild = localStorage.getItem(BUILD_STORAGE_KEY);
                if (prevBuild && prevBuild !== CURRENT_APP_BUILD) {
                    performHardCachePurge(CURRENT_APP_BUILD);
                    return;
                }
                if (!prevBuild) {
                    localStorage.setItem(BUILD_STORAGE_KEY, CURRENT_APP_BUILD);
                }
            } catch (_) {}

            async function checkRemoteVersion() {
                try {
                    const res = await fetch('./version.json?_t=' + Date.now(), {
                        cache: 'no-store',
                        headers: {
                            'Cache-Control': 'no-cache, no-store, must-revalidate',
                            'Pragma': 'no-cache'
                        }
                    });
                    if (!res.ok) return;
                    const data = await res.json();
                    const remoteBuild = data && data.buildId ? String(data.buildId).trim() : '';
                    if (!remoteBuild) return;
                    const localBuild = localStorage.getItem(BUILD_STORAGE_KEY) || CURRENT_APP_BUILD;
                    if (remoteBuild !== localBuild || remoteBuild !== CURRENT_APP_BUILD) {
                        await performHardCachePurge(remoteBuild);
                    }
                } catch (_) {}
            }

            checkRemoteVersion();
            window.addEventListener('pageshow', (e) => { if (e.persisted) checkRemoteVersion(); });
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') checkRemoteVersion();
            });
        })();
    </script>
    <script>
        // 0ms Inline Theme Pre-hydration
        (function() {
            try {
                const savedTheme = localStorage.getItem('bma_checkin_theme_mode_v2_7');
                if (savedTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else if (savedTheme === 'light') {
                    document.documentElement.classList.remove('dark');
                }
            } catch (_) {}
        })();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Smooth vertical gradient background using BMA Civic 9-color palette without pattern/clutter */
        body.login-vertical-gradient,
        .login-vertical-gradient {
            background: 
                radial-gradient(ellipse 70% 50% at 85% 10%, rgba(9, 113, 206, 0.32) 0%, transparent 65%),
                radial-gradient(ellipse 55% 45% at 12% 88%, rgba(235, 61, 169, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 85% 82%, rgba(255, 180, 73, 0.28) 0%, transparent 60%),
                radial-gradient(ellipse 60% 45% at 15% 18%, rgba(72, 0, 128, 0.35) 0%, transparent 65%),
                linear-gradient(180deg, #132E22 0%, #215A41 18%, #00744B 42%, #00995D 65%, #00C08A 84%, #66A33A 100%) !important;
            background-color: #00744B !important;
            min-height: 100dvh !important;
            height: 100dvh !important;
        }
        html.dark body.login-vertical-gradient,
        html.dark .login-vertical-gradient {
            background: 
                radial-gradient(ellipse 70% 50% at 85% 10%, rgba(9, 113, 206, 0.22) 0%, transparent 65%),
                radial-gradient(ellipse 55% 45% at 12% 88%, rgba(235, 61, 169, 0.18) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 85% 82%, rgba(255, 180, 73, 0.20) 0%, transparent 60%),
                radial-gradient(ellipse 60% 45% at 15% 18%, rgba(72, 0, 128, 0.28) 0%, transparent 65%),
                linear-gradient(180deg, #071911 0%, #122B20 20%, #004D32 45%, #00744B 75%, #00C08A 100%) !important;
            background-color: #071911 !important;
            min-height: 100dvh !important;
            height: 100dvh !important;
        }

        :root {
            --ld-stage-size: 112px;
            --ld-frame-size: 96px;
        }

        /* Civic Orbital Halo + Intact Logo Badge */
        .logo-stage {
            position: relative;
            width: var(--ld-stage-size, 112px);
            height: var(--ld-stage-size, 112px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
        }

        .halo-ring {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: conic-gradient(from 0deg, rgba(0, 192, 138, 0.12), #00C08A, #F6DE51, rgba(0, 116, 75, 0.15), rgba(0, 192, 138, 0.12));
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 2.5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 2.5px));
            animation: halo-spin 1.8s linear infinite;
        }
        @keyframes halo-spin {
            to { transform: rotate(360deg); }
        }

        .logo-frame {
            width: var(--ld-frame-size, 96px);
            height: var(--ld-frame-size, 96px);
            border-radius: 1.25rem;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 116, 75, 0.06);
            border: 1px solid rgba(0, 116, 75, 0.14);
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 116, 75, 0.08);
            position: relative;
            z-index: 1;
        }
        html.dark .logo-frame {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(52, 211, 153, 0.22);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        #ldOrgLogo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            animation: gentle-pulse 2s ease-in-out infinite;
        }
        #ldOrgLogo.hidden,
        #ldLogoFallback.hidden {
            display: none !important;
        }
        @keyframes gentle-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Card Container */
        .ld-card {
            background: var(--bma-surface-1, #FFFFFF);
            border: 1px solid var(--bma-border, #E2E8F0);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
            border-radius: 1.5rem;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        html.dark .ld-card {
            background: var(--bma-surface-1, #11231B);
            border-color: var(--bma-border, #244737);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
        }

        .login-card-header-gradient {
            background: linear-gradient(180deg, #1A4D38 0%, #00744B 100%) !important;
        }
        html.dark .login-card-header-gradient {
            background: linear-gradient(180deg, #0F2D21 0%, #005436 100%) !important;
        }

        /* Progress Bar */
        .ld-bar {
            width: 160px;
            height: 4px;
            border-radius: 99px;
            background: var(--bma-border, #E2E8F0);
            overflow: hidden;
            position: relative;
        }
        html.dark .ld-bar {
            background: rgba(255, 255, 255, 0.12);
        }
        .ld-bar > span {
            position: absolute;
            left: -40%;
            top: 0;
            height: 100%;
            width: 40%;
            border-radius: 99px;
            background: linear-gradient(90deg, #00744B, #00C08A, #F6DE51);
            animation: ld-slide 1.2s ease-in-out infinite;
        }
        @keyframes ld-slide {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        /* Fade out transition */
        .sp-fade {
            opacity: 0 !important;
            transform: scale(0.98);
            transition: opacity 0.22s ease-out, transform 0.22s ease-out !important;
        }

        @media (max-width: 640px) {
            :root {
                --ld-stage-size: 96px;
                --ld-frame-size: 84px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .halo-ring {
                animation: none;
                opacity: 0.6;
            }
            #ldOrgLogo {
                animation: none;
            }
            .ld-bar > span {
                animation-duration: 2.4s;
            }
        }
    </style>
</head>
<body class="login-vertical-gradient flex items-center justify-center min-h-[100dvh] h-[100dvh] p-4 select-none">
    <div id="bmaSplash" class="w-full max-w-sm flex flex-col items-center">
        <div class="ld-card relative overflow-hidden w-full px-6 py-8 sm:px-8 sm:py-9 flex flex-col items-center text-center">
            <!-- Top Civic Accent Stripe -->
            <div class="login-card-header-gradient h-1.5 w-full absolute top-0 left-0"></div>

            <!-- Single Intact Civic Logo Stage -->
            <div id="ldLogoStage" class="logo-stage my-3" aria-label="กำลังโหลดระบบ">
                <div class="halo-ring" aria-hidden="true"></div>
                <div class="logo-frame">
                    <img id="ldOrgLogo" src="https://lh3.googleusercontent.com/d/1wMP2T2zV8N9hDGIBed_OO2WlM59pl2qc" alt="Organization Logo" decoding="async" fetchpriority="high" onerror="this.classList.add('hidden');document.getElementById('ldLogoFallback')?.classList.remove('hidden');">
                    <div id="ldLogoFallback" class="hidden w-full h-full flex items-center justify-center text-emerald-600 dark:text-emerald-400 text-3xl sm:text-4xl" aria-hidden="true">
                        <i class="fa-solid fa-landmark"></i>
                    </div>
                </div>
            </div>

            <!-- Organization & System Branding -->
            <h1 id="ldOrgName" class="text-base sm:text-lg font-bold text-slate-800 dark:text-slate-100 tracking-tight mt-1">สำนักเทศกิจ</h1>
            <p id="ldBureauName" class="text-xs sm:text-sm font-semibold text-emerald-700 dark:text-emerald-400 mt-0.5">สำนักงานตรวจและบังคับการ</p>
            <p id="ldSystemTitle" class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">ระบบลงเวลาปฏิบัติราชการ (สตบ.สนท.)</p>
            <script>
                // 0ms instant text & logo pre-hydration from cached brand / settings
                (function() {
                    const DEFAULT_LOGO = 'https://lh3.googleusercontent.com/d/1wMP2T2zV8N9hDGIBed_OO2WlM59pl2qc';
                    const logoImg = document.getElementById('ldOrgLogo');
                    const fallbackEl = document.getElementById('ldLogoFallback');

                    // Bind safe onerror fallback immediately
                    if (logoImg && fallbackEl) {
                        logoImg.onerror = function() {
                            logoImg.classList.add('hidden');
                            fallbackEl.classList.remove('hidden');
                        };
                        if (logoImg.complete && logoImg.naturalWidth === 0 && logoImg.getAttribute('src')) {
                            logoImg.classList.add('hidden');
                            fallbackEl.classList.remove('hidden');
                        }
                    }

                    try {
                        let brand = null;
                        const rawBrand = localStorage.getItem('bma_cached_brand_v2_7');
                        if (rawBrand) {
                            try { brand = JSON.parse(rawBrand); } catch (_) {}
                        }
                        let sessionSettings = null;
                        const rawSettings = sessionStorage.getItem('bma_checkin_cached_settings_v2_7');
                        if (rawSettings) {
                            try { sessionSettings = JSON.parse(rawSettings); } catch (_) {}
                        }

                        if (!brand || typeof brand !== 'object') {
                            if (sessionSettings && typeof sessionSettings === 'object') {
                                brand = {
                                    orgName: sessionSettings.organization_name,
                                    bureauName: sessionSettings.bureau_name,
                                    headerSystemTitle: sessionSettings.header_system_title,
                                    logoUrl: sessionSettings.logo_url
                                };
                            }
                        } else if (sessionSettings && typeof sessionSettings === 'object') {
                            if (!brand.logoUrl && sessionSettings.logo_url) brand.logoUrl = sessionSettings.logo_url;
                            if (!brand.orgName && sessionSettings.organization_name) brand.orgName = sessionSettings.organization_name;
                            if (!brand.bureauName && sessionSettings.bureau_name) brand.bureauName = sessionSettings.bureau_name;
                            if (!brand.headerSystemTitle && sessionSettings.header_system_title) brand.headerSystemTitle = sessionSettings.header_system_title;
                        }

                        if (brand && typeof brand === 'object') {
                            window.__bmaPreloadedBrand = brand;
                            if (brand.orgName) {
                                const el = document.getElementById('ldOrgName');
                                if (el) el.textContent = brand.orgName;
                            }
                            if (brand.bureauName) {
                                const el = document.getElementById('ldBureauName');
                                if (el) el.textContent = brand.bureauName;
                            }
                            if (brand.headerSystemTitle) {
                                const el = document.getElementById('ldSystemTitle');
                                if (el) el.textContent = brand.headerSystemTitle;
                            }

                            const rawLogo = String(brand.logoUrl || '').trim();
                            if (rawLogo && logoImg) {
                                const isSafeProtocol = /^(?:https?:\/\/[^\s'"()<>]+|data:image\/[a-zA-Z0-9+.-]+;base64,[A-Za-z0-9+/=]+)$/i.test(rawLogo);
                                if (isSafeProtocol) {
                                    let resolvedUrl = rawLogo;
                                    const isGoogleDrive = /(?:drive\.google\.com|docs\.google\.com|lh3\.googleusercontent\.com)/i.test(rawLogo);
                                    if (isGoogleDrive) {
                                        const driveMatch = rawLogo.match(/(?:\/d\/|[?&]id=|\/file\/d\/)([-\w]{20,})/);
                                        if (driveMatch && driveMatch[1]) {
                                            resolvedUrl = 'https://lh3.googleusercontent.com/d/' + driveMatch[1];
                                        }
                                    }
                                    const sanitized = resolvedUrl.replace(/['"\\]/g, '');
                                    if (sanitized && sanitized !== logoImg.getAttribute('src')) {
                                        if (fallbackEl) fallbackEl.classList.add('hidden');
                                        logoImg.classList.remove('hidden');
                                        logoImg.src = sanitized;
                                    }
                                }
                            }
                        }
                    } catch (_) {}
                })();
            </script>

            <!-- Status Step Chip -->
            <div class="mt-4 flex items-center justify-center">
                <div class="ld-chip px-3 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800/80 text-emerald-800 dark:text-emerald-300 text-xs font-semibold flex items-center gap-2">
                    <i id="ldSpinnerIcon" class="fa-solid fa-circle-notch fa-spin text-emerald-600 dark:text-emerald-400 text-xs"></i>
                    <span id="ldStepLabel">กำลังเตรียมข้อมูลระบบ...</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="ld-bar mt-4">
                <span id="ldProgressInner"></span>
            </div>

            <!-- Watchdog Fallback Actions (Hidden by default, shown after 12s timeout) -->
            <div id="ldFallbackActions" class="hidden mt-5 pt-4 border-t border-slate-200 dark:border-slate-800 w-full flex flex-col items-center gap-2.5">
                <p class="text-xs text-amber-600 dark:text-amber-400 font-medium">การเชื่อมต่อใช้เวลานานกว่าปกติ</p>
                <div class="flex gap-2 w-full justify-center">
                    <button id="btnRetryLoad" type="button" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow-sm transition cursor-pointer">
                        <i class="fa-solid fa-rotate-right mr-1.5"></i>ลองใหม่อีกครั้ง
                    </button>
                    <button id="btnBackToLogin" type="button" class="px-3.5 py-1.5 rounded-xl bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-xs font-semibold transition cursor-pointer">
                        <i class="fa-solid fa-arrow-left mr-1.5"></i>กลับหน้าเข้าสู่ระบบ
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- BFCache back-button safety -->
    <script>
        window.addEventListener('pageshow', function(event) {
            if (event.persisted || (window.performance && window.performance.getEntriesByType && window.performance.getEntriesByType('navigation')[0] && window.performance.getEntriesByType('navigation')[0].type === 'back_forward')) {
                window.location.replace('loading.html?entry=session');
            }
        });
    </script>
