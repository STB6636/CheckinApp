<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ภาพรวม - ระบบลงเวลาปฏิบัติราชการ กรุงเทพมหานคร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/css/bma-theme.css">
</head>
<body class="min-h-screen flex flex-col">

    <!-- Deep Emerald Sidebar Navigation -->
    <div id="bmaSidebarContainer"></div>

    <!-- พื้นที่หลักด้านขวา -->
    <div class="lg:pl-72 flex-1 flex flex-col min-h-screen">

        <!-- Topbar Navigation -->
        <div id="bmaTopbarContainer"></div>

        <!-- เนื้อหาหลักของหน้า "ภาพรวม" -->
        <main class="flex-1 p-4 lg:p-8 space-y-6">

            <!-- เฉพาะเมื่อ Responsive Mobile เท่านั้น: เมนูทางลัดไอคอนสีสไตล์ iPhone -->
            <div id="mobileShortcutContainer"></div>

            <!-- แถบตัวกรองวันที่ประจำวัน -->
            <div class="bma-card p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex items-center gap-3 flex-wrap">
                    <label for="dashboardDateFilter" class="text-sm font-bold bma-text-main">
                        <i class="fa-regular fa-calendar-check mr-1.5" style="color: var(--bma-primary);"></i>ข้อมูลประจำวันที่:
                    </label>
                    <input type="date" id="dashboardDateFilter" class="bma-input w-auto py-1.5 px-3 text-sm font-semibold">
                    <span id="dashboardThaiDateBadge" class="bma-badge bma-badge-success text-xs">15 ม.ค. 69</span>
                    <button type="button" id="btnRefreshDashboard" class="btn-bma-soft text-xs py-2 px-3.5">
                        <i class="fa-solid fa-rotate"></i>
                        <span>อัปเดตข้อมูล</span>
                    </button>
                </div>

                <div class="text-xs bma-text-sub font-semibold">
                    <i class="fa-solid fa-palette mr-1" style="color: var(--bma-primary);"></i>สีสถานะดึงตามการตั้งค่าระบบ
                </div>
            </div>

            <!-- ส่วนแสดง Jewel-Tone Stat Cards 5 ใบ -->
            <div id="dashboardKpiCardsGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4">
                <div class="bma-card p-5"><div class="bma-skeleton h-28 w-full"></div></div>
                <div class="bma-card p-5"><div class="bma-skeleton h-28 w-full"></div></div>
                <div class="bma-card p-5"><div class="bma-skeleton h-28 w-full"></div></div>
                <div class="bma-card p-5"><div class="bma-skeleton h-28 w-full"></div></div>
                <div class="bma-card p-5"><div class="bma-skeleton h-28 w-full"></div></div>
            </div>

            <!-- ตารางสรุปรายการสถานะการลงเวลาปฏิบัติราชการรายบุคคล (แสดง 5 รายการล่าสุด + ตัวเลือก [5,10,15,20] + ปุ่มหน้าถัดไป) -->
            <div class="bma-card p-5 space-y-4" style="border-top: 3px solid var(--g1);">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                        <h3 class="text-base font-extrabold bma-text-main">รายการสถานะการลงเวลาปฏิบัติราชการรายบุคคล</h3>
                        <p class="text-xs bma-text-sub">แสดงรายชื่อผู้ที่ลงเวลาปฏิบัติงานล่าสุดในวันที่เลือกตามขอบเขตการมองเห็น</p>
                    </div>
                    <a href="reports.html" class="btn-bma-soft text-xs py-2 px-3.5 no-underline self-start sm:self-auto">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        <span>เปิดหน้ารายงานฉบับเต็ม</span>
                    </a>
                </div>

                <!-- แถบควบคุมการแบ่งหน้า (ตัวเลือกแสดง [5, 10, 15, 20] รายการต่อหน้า และปุ่มหน้าก่อนหน้า/หน้าถัดไป) -->
                <div class="flex flex-wrap items-center justify-between gap-3 p-3 rounded-xl bma-info-box text-xs">
                    <div class="flex items-center gap-2">
                        <label for="dashboardPageSizeSelect" class="font-bold bma-text-main">แสดงรายการต่อหน้า:</label>
                        <select id="dashboardPageSizeSelect" class="bma-select w-auto py-1 px-2.5 text-xs font-bold">
                            <option value="5" selected>5 รายการ</option>
                            <option value="10">10 รายการ</option>
                            <option value="15">15 รายการ</option>
                            <option value="20">20 รายการ</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-2">
                        <button type="button" id="btnDashboardPrevPage" class="btn-bma-outline py-1 px-3 text-xs">
                            <i class="fa-solid fa-chevron-left"></i>
                            <span>ก่อนหน้า</span>
                        </button>
                        <span id="dashboardPageInfoText" class="font-bold bma-text-main px-2">หน้า 1 / 1</span>
                        <button type="button" id="btnDashboardNextPage" class="btn-bma-primary py-1 px-3 text-xs">
                            <span>หน้าถัดไป</span>
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- ตารางจัดสัดส่วนความกว้างคอลัมน์ให้พอดีกับข้อมูล -->
                <div class="bma-table-container">
                    <table class="bma-table text-sm">
                        <thead>
                            <tr>
                                <th class="w-14 text-center">ลำดับ</th>
                                <th class="min-w-[180px] whitespace-nowrap">ชื่อ-นามสกุล</th>
                                <th class="min-w-[200px]">ตำแหน่ง</th>
                                <th class="min-w-[210px]">สังกัด (สำนักงาน/กอง &gt; ส่วน/ฝ่าย)</th>
                                <th class="w-28 text-center whitespace-nowrap">เวลาเข้างาน</th>
                                <th class="w-28 text-center whitespace-nowrap">เวลาออกงาน</th>
                                <th class="w-40 text-center whitespace-nowrap">สถานะ</th>
                            </tr>
                        </thead>
                        <tbody id="dashboardRecentTableBody"></tbody>
                    </table>
                </div>
            </div>

        </main>

        <!-- Footer ระบบ -->
        <div id="bmaFooterContainer"></div>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <div id="bmaMobileBottomNav"></div>

    <script type="module" src="assets/js/controllers/DashboardController.js"></script>
</body>
</html>
