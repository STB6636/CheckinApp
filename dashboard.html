<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ภาพรวม - ระบบลงเวลาปฏิบัติราชการ กรุงเทพมหานคร</title>
    <!-- Tailwind CSS CDN พร้อมบังคับ darkMode: 'class' -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/css/bma-theme.css">
</head>
<body class="min-h-screen flex flex-col">

    <!-- Deep Emerald Sidebar Navigation (.sidebar-dark-bma เรนเดอร์ครั้งเดียวโดย AppLayout) -->
    <div id="bmaSidebarContainer"></div>

    <!-- พื้นที่หลักด้านขวา (พื้นหลังโหมดสว่าง Soft Sage Mint #f5f8f6 / โหมดมืด #0D1117) -->
    <div class="lg:pl-72 flex-1 flex flex-col min-h-screen">

        <!-- Topbar Navigation (เรนเดอร์ครั้งเดียวโดย AppLayout) -->
        <div id="bmaTopbarContainer"></div>

        <!-- เนื้อหาหลักของหน้า "ภาพรวม" (โหลดสลับเฉพาะส่วน <main> นี้เมื่อคลิกเมนูแบบ AJAX) -->
        <main class="flex-1 p-4 lg:p-8 space-y-6">

            <!-- เฉพาะเมื่อ Responsive Mobile เท่านั้น: เมนูทางลัดไอคอนสีเหมือนไอคอน iPhone -->
            <div id="mobileShortcutContainer"></div>

            <!-- แถบตัวกรองวันที่และตั้งค่าสีการ์ดสถานะ -->
            <div class="bma-card p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex items-center gap-3 flex-wrap">
                    <label for="dashboardDateFilter" class="text-sm font-bold bma-text-main">
                        <i class="fa-regular fa-calendar-check mr-1.5" style="color: var(--bma-primary);"></i>ข้อมูลประจำวันที่:
                    </label>
                    <input type="date" id="dashboardDateFilter" class="bma-input w-auto py-1.5 px-3 text-sm font-semibold">
                    <button type="button" id="btnRefreshDashboard" class="btn-bma-soft text-xs py-2 px-3.5">
                        <i class="fa-solid fa-rotate"></i>
                        <span>อัปเดตข้อมูล</span>
                    </button>
                </div>

                <!-- Color Picker สำหรับปรับสีการ์ด Jewel-Tone และป้ายสถานะแต่ละประเภทได้ทันที -->
                <div class="flex items-center gap-3 flex-wrap text-xs">
                    <span class="font-bold bma-text-sub">กำหนดสีสถานะ:</span>
                    <label class="flex items-center gap-1 cursor-pointer font-semibold bma-text-main">
                        <input type="color" id="colorPickerNormal" value="#007B3E" class="w-6 h-6 rounded border-0 cursor-pointer">
                        <span>ปกติ</span>
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer font-semibold bma-text-main">
                        <input type="color" id="colorPickerLate" value="#F59E0B" class="w-6 h-6 rounded border-0 cursor-pointer">
                        <span>สาย</span>
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer font-semibold bma-text-main">
                        <input type="color" id="colorPickerSpecial" value="#6366F1" class="w-6 h-6 rounded border-0 cursor-pointer">
                        <span>กรณีพิเศษ</span>
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer font-semibold bma-text-main">
                        <input type="color" id="colorPickerAbsent" value="#E11D48" class="w-6 h-6 rounded border-0 cursor-pointer">
                        <span>ยังไม่ลงเวลา</span>
                    </label>
                </div>
            </div>

            <!-- ส่วนแสดง Jewel-Tone Stat Cards (.stat-card พร้อม .deco-1, .deco-2 และ Progress Fill) -->
            <div id="dashboardKpiCardsGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4">
                <div class="bma-card p-5"><div class="bma-skeleton h-28 w-full"></div></div>
                <div class="bma-card p-5"><div class="bma-skeleton h-28 w-full"></div></div>
                <div class="bma-card p-5"><div class="bma-skeleton h-28 w-full"></div></div>
                <div class="bma-card p-5"><div class="bma-skeleton h-28 w-full"></div></div>
                <div class="bma-card p-5"><div class="bma-skeleton h-28 w-full"></div></div>
            </div>

            <!-- ตารางสรุปรายการลงเวลาล่าสุดของวันนี้ (หัวตารางสีเขียวพาสเทล #eef7f1 ตัวอักษร #2c4a38) -->
            <div class="bma-card p-5" style="border-top: 3px solid var(--g1);">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h3 class="text-base font-extrabold bma-text-main">รายการสถานะการลงเวลาปฏิบัติราชการรายบุคคล</h3>
                        <p class="text-xs bma-text-sub">แสดงข้อมูลตามขอบเขตการมองเห็นของผู้ดูแลระบบ</p>
                    </div>
                    <a href="reports.html" class="btn-bma-soft text-xs py-2 px-3.5 no-underline">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        <span>เปิดหน้ารายงานการลงเวลา</span>
                    </a>
                </div>

                <div class="bma-table-container">
                    <table class="bma-table text-sm">
                        <thead>
                            <tr>
                                <th class="w-14 text-center">ลำดับ</th>
                                <th>ชื่อ-นามสกุล</th>
                                <th>ตำแหน่ง</th>
                                <th>สังกัด (สำนักงาน/กอง &gt; ส่วน/ฝ่าย)</th>
                                <th class="text-center">เวลาเข้างาน</th>
                                <th class="text-center">เวลาออกงาน</th>
                                <th class="text-center">สถานะ</th>
                            </tr>
                        </thead>
                        <tbody id="dashboardRecentTableBody"></tbody>
                    </table>
                </div>
            </div>

        </main>

        <!-- Footer ระบบ (เรนเดอร์ครั้งเดียวโดย AppLayout) -->
        <div id="bmaFooterContainer"></div>
    </div>

    <!-- Mobile Bottom Navigation Bar (เรนเดอร์ครั้งเดียวโดย AppLayout) -->
    <div id="bmaMobileBottomNav"></div>

    <script type="module" src="assets/js/controllers/DashboardController.js"></script>
</body>
</html>
