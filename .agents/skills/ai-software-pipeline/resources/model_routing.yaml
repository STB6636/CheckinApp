workflow_name: "Enterprise_AI_Software_Engineering_Pipeline"
version: "1.0.0"

global_constraints:
  minimum_model_version: "Flash 3.8 High"
  fallback_behavior: "reject_if_below_minimum_model"
  communication_format: "Structured_Markdown_and_JSON_Handoff"
  code_completeness_policy: "NO_PLACEHOLDERS_OR_TRUNCATION"

agents:
  orchestrator:
    id: "agent_00_orchestrator"
    role: "Master Technical Orchestrator & Project Manager"
    model: "Flash 3.8 High"
    temperature: 0.1
    top_p: 0.9
    max_output_tokens: 16384

  subagent_requirements:
    id: "agent_01_ba_sa"
    role: "Requirements & System Analyst"
    model: "Flash 3.8 High"
    temperature: 0.2
    top_p: 0.9
    max_output_tokens: 16384

  subagent_architect:
    id: "agent_02_architect"
    role: "System Architect & Database Designer"
    model: "Flash 3.8 High"
    temperature: 0.1
    top_p: 0.85
    max_output_tokens: 32768

  subagent_backend:
    id: "agent_03_backend"
    role: "Senior Backend Engineer"
    model: "Flash 3.8 High"
    temperature: 0.1
    top_p: 0.8
    max_output_tokens: 65536

  subagent_frontend:
    id: "agent_04_frontend"
    role: "Senior Frontend & UI/UX Engineer"
    model: "Flash 3.8 High"
    temperature: 0.15
    top_p: 0.85
    max_output_tokens: 65536

  subagent_qa_sec:
    id: "agent_05_qa_security"
    role: "QA Automation & Application Security Engineer"
    model: "Flash 3.8 High"
    temperature: 0.1
    top_p: 0.8
    max_output_tokens: 32768

  subagent_devops:
    id: "agent_06_devops"
    role: "DevOps & Infrastructure Engineer"
    model: "Flash 3.8 High"
    temperature: 0.1
    top_p: 0.8
    max_output_tokens: 32768